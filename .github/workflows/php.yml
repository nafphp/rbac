name: NAF RBAC

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: nafinity_rbac_test
          MYSQL_USER: board
          MYSQL_PASSWORD: board
          MYSQL_ROOT_PASSWORD: root-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
    - uses: actions/checkout@v7

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    # The suite borrows AbstractMigration from a host that has naf/database.
    # This package's own install is one, which is all NAF_HOST has to name.
    - name: Run test suite
      env:
        NAF_HOST: ${{ github.workspace }}
        NAF_RBAC_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=nafinity_rbac_test
        NAF_RBAC_MYSQL_USER: board
        NAF_RBAC_MYSQL_PASSWORD: board
      run: composer run-script test

    - name: Check code style
      run: composer run-script style:check
